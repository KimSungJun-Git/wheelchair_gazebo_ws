ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    transform_time_offset: 0.1
    transform_timeout: 0.3

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # [1] 바퀴 엔코더: Nav2 자율주행용 기본 선속도 사용 (기존 설정 복원)
    odom0: /odom
    odom0_config: [false, false, false, 
                   false, false, false, 
                   true,  false,  false, 
                   false, false, false,  
                   false, false, false] 
    odom0_differential: false

    # [2] IMU 센서: 정밀 회전 각속도(yaw rate) 반영
    imu0: /imu/data_fixed 
    imu0_config: [false, false, false, 
                  false, false, false,  
                  false, false, false, 
                  false, false, true, 
                  false, false, false] 
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_relative: true