dynamic_settings:
  randomize: true
  behavior_mode: "random_walk"          # 진짜 보행자 전역 랜덤 워크 (거점 제한 완전 해제)
  roam_min_dist: 2.5                    # 1회 이동 최소 거리 (m) - 복도 따라 시원하게 이동
  roam_max_dist: 6.5                    # 1회 이동 최대 거리 (m)
  speed_range: [0.35, 1.10]             # 자연스러운 보행 속도 (m/s)
  repulsion_dist: 1.20                  # 장애물 간 상호 반발 거리 (m)
  repulsion_gain: 0.50                  # 상호 반발 속도 가중치
  robot_avoid_margin: 0.25              # 가제보 로봇 25cm 이내 접근 시 즉각 튕김 트리거 (m)
  robot_avoid_speed: 1.15               # 튕겨나갈 때 발진 속도 (m/s)
  pause_prob: 0.15                      # 목표점 도달 시 잠깐 멈칫할 확률 (15%)
  pause_range_sec: [0.3, 1.2]           # 멈칫 대기 시간 (초)
  jitter_range_m: 0.30                  # 보행 중 자연스러운 곡선 흔들림

